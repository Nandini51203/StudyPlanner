{% extends "base.html" %}{% block content %}<h3>Quiz {% if q_demo %}<span class="badge bg-warning text-dark">DEMO</span>{% endif %}</h3>
<div class="cardx"><div class="progress mb-3"><div id="pb" class="progress-bar"></div></div>
<h5 id="qt"></h5><div id="opts" class="mt-3"></div>
<button id="prev" class="btn btn-outline-secondary">Previous</button> <button id="next" class="btn btn-primary">Next</button>
<button id="sub" class="btn btn-success d-none">Submit quiz</button></div>{% endblock %}
{% block scripts %}<script>
const Q = {{ questions|tojson }}, A = Array(Q.length).fill(null); let i = 0;
function show() {
  const q = Q[i]; $("qt").textContent = `${i + 1}/${Q.length}. ${q.question}`; $("pb").style.width = ((i + 1) / Q.length * 100) + "%"; $("opts").innerHTML = "";
  q.options.forEach((o, k) => { const b = document.createElement("button"); b.className = "btn w-100 text-start mb-2 " + (A[i] === k ? "btn-primary" : "btn-outline-secondary"); b.textContent = o; b.onclick = () => { A[i] = k; show(); }; $("opts").appendChild(b); });
  $("prev").disabled = i == 0; $("next").classList.toggle("d-none", i == Q.length - 1); $("sub").classList.toggle("d-none", i != Q.length - 1);
}
$("prev").onclick = () => { i--; show(); }; $("next").onclick = () => { i++; show(); };
$("sub").onclick = async () => {
  if (A.includes(null) && !confirm("Some questions are unanswered. Submit anyway?")) return;
  $("sub").disabled = true;
  const r = await fetch("/api/submit/{{ qid }}", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({answers: A})});
  const d = await r.json(); location = "/results/" + d.attempt_id;
};
show();
</script>{% endblock %}
